# Workflow for building and deploying this static site to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes to any branch; the deploy job checks deploy-branch.txt
  # to decide whether the pushed branch is actually the one to deploy.
  push:
    branches: ["**"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check deploy branch
        id: branch_check
        run: |
          DEPLOY_BRANCH=$(grep -v '^#' deploy-branch.txt | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')
          echo "Configured deploy branch: $DEPLOY_BRANCH"
          echo "Pushed branch: ${{ github.ref_name }}"
          if [ "$DEPLOY_BRANCH" = "${{ github.ref_name }}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: pushed branch does not match deploy-branch.txt"
          fi
      - name: Setup Node
        if: steps.branch_check.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: steps.branch_check.outputs.proceed == 'true'
        run: npm ci
      - name: Build CSS
        if: steps.branch_check.outputs.proceed == 'true'
        run: npm run build
      - name: Remove dev dependencies before upload
        if: steps.branch_check.outputs.proceed == 'true'
        run: rm -rf node_modules
      - name: Setup Pages
        if: steps.branch_check.outputs.proceed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.branch_check.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (index.html, dist/, vendor/, etc.)
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.branch_check.outputs.proceed == 'true'
        uses: actions/deploy-pages@v5
