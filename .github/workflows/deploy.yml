name: Deploy to GitHub Pages

on:
  push:
    branches:
      - model-viewer

# --- PERMISSIONS ---
permissions:
  contents: read
  pages: write
  id-token: write
# ----------------------

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: model-viewer

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
