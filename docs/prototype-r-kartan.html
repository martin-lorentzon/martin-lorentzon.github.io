<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kartan Prototyp</title>
    <!-- Internal draft: a working prototype of direction R (round 5). Not linked from the site.
         One Three.js scene, two zoom levels: seen from straight above with flattened buildings it is the 2D map;
         zooming in raises the city and drops into a third-person view. Walking is optional: every place is one click away. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --land: #ddd5c6; --water: #9fbcc2; --ink: #1a1a1a; --sand: #f2eee7; --cap: #6c665d; --you: #2b4cc4; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--water); color: var(--ink); font: 15px/1.45 "Inter Tight", system-ui, sans-serif; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      button, a { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
      .skip { position: fixed; left: 16px; top: -60px; z-index: 20; background: var(--ink); color: var(--sand); padding: 8px 12px; border-radius: 6px; }
      .skip:focus { top: 12px; }
      .ttl { position: fixed; left: 16px; top: 16px; z-index: 4; background: var(--ink); color: var(--sand); padding: 10px 14px; font: 800 20px/1.05 "Archivo", sans-serif; font-variation-settings: "wdth" 62; letter-spacing: 0.08em; text-transform: uppercase; }
      .ttl small { display: block; font: 400 11px/1.5 "JetBrains Mono", monospace; letter-spacing: 0; text-transform: none; color: #b9b2a6; }
      nav.dest { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 4; }
      nav.dest ul { list-style: none; margin: 0; padding: 2px; display: flex; gap: 6px; }
      nav.dest button { white-space: nowrap; background: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
      nav.dest button i { font-style: normal; font-size: 12px; }
      nav.dest button[aria-current="true"] { background: var(--ink); color: var(--sand); }
      .layer { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
      .mk { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 0; will-change: transform; }
      .mk i { width: 40px; height: 40px; border-radius: 8px; background: var(--ink); color: var(--sand); display: grid; place-items: center; font-style: normal; font-size: 17px; border: 3px solid #fff; }
      .mk b { font: 700 12px/1 "Inter Tight", sans-serif; background: #fff; padding: 4px 7px; border-radius: 4px; white-space: nowrap; }
      .dl { position: absolute; left: 0; top: 0; font: 800 16px/1 "Archivo", sans-serif; font-variation-settings: "wdth" 62; letter-spacing: 0.16em; text-transform: uppercase; color: #1a1a1a8c; white-space: nowrap; }
      .dl.river { font-style: italic; font-weight: 600; letter-spacing: 0.4em; color: #4f727a; font-size: 13px; }
      .you { position: absolute; left: 0; top: 0; font: 600 11px/1 "JetBrains Mono", monospace; color: var(--you); white-space: nowrap; background: #ffffffcc; padding: 3px 5px; border-radius: 3px; }
      .leg { position: fixed; left: 16px; bottom: 16px; z-index: 3; background: var(--sand); border: 1.5px solid var(--ink); padding: 10px 14px; display: grid; gap: 4px; font: 400 11px/1.3 "JetBrains Mono", monospace; }
      .leg b { font: 800 12px/1.2 "Archivo", sans-serif; font-variation-settings: "wdth" 62; text-transform: uppercase; letter-spacing: 0.1em; }
      .ctl { position: fixed; right: 16px; bottom: 16px; z-index: 4; display: flex; gap: 6px; }
      .ctl button { background: #fff; border: 1.5px solid var(--ink); border-radius: 6px; min-width: 44px; min-height: 44px; padding: 0 14px; font-weight: 600; cursor: pointer; }
      .ctl button:disabled { opacity: 0.35; cursor: default; }
      .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; font: 400 12px/1.4 "JetBrains Mono", monospace; background: #ffffffe0; padding: 7px 11px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
      .panel { position: fixed; right: 16px; top: 72px; z-index: 5; width: min(380px, calc(100% - 32px)); background: var(--sand); border: 1.5px solid var(--ink); border-radius: 12px; padding: 20px 22px 22px; transform: translateX(calc(100% + 32px)); transition: transform 0.35s ease; }
      .panel.open { transform: none; }
      .panel small { display: block; font: 400 11px/1.5 "JetBrains Mono", monospace; color: var(--cap); letter-spacing: 0.05em; }
      .panel h2 { margin: 6px 0 10px; font: 800 28px/1.02 "Archivo", sans-serif; letter-spacing: -0.03em; }
      .panel p { margin: 0 0 10px; }
      .panel ul { margin: 0 0 12px; padding: 0; list-style: none; font-size: 13.5px; }
      .panel li { border-top: 1px solid #1a1a1a1f; padding: 6px 0; }
      .panel .tip { font: 400 12px/1.5 "JetBrains Mono", monospace; color: var(--you); }
      .panel .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .panel .acts a, .panel .acts button { min-height: 44px; padding: 0 16px; border-radius: 8px; display: inline-flex; align-items: center; font-weight: 600; text-decoration: none; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; }
      .panel .acts a { background: var(--ink); color: var(--sand); }
      .panel .x { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; background: none; font-size: 22px; cursor: pointer; border-radius: 8px; }
      .list { position: fixed; inset: 0; z-index: 10; background: #1a1a1a66; display: grid; place-items: center; padding: 12px; }
      .list[hidden] { display: none; }
      .list .box { background: var(--sand); border-radius: 12px; padding: 22px; width: min(560px, 100%); max-height: 86vh; overflow: auto; }
      .list h2 { margin: 0 0 12px; font: 800 24px/1 "Archivo", sans-serif; }
      .list ul { list-style: none; margin: 0; padding: 0; }
      .list li button { width: 100%; text-align: left; background: #fff; border: 1.5px solid #1a1a1a26; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
      .list li b { display: block; font-size: 16px; }
      .list li span { color: var(--cap); font-size: 13.5px; }
      .list .close { margin-top: 6px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: transparent; font-weight: 600; cursor: pointer; }
      .draft { position: fixed; right: 16px; top: 16px; z-index: 6; font: 400 11px/1.4 "JetBrains Mono", monospace; background: var(--ink); color: var(--sand); padding: 6px 10px; border-radius: 6px; max-width: 30ch; }
      @media (max-width: 1100px) { nav.dest { left: 16px; right: 16px; top: 80px; transform: none; overflow-x: auto; } nav.dest ul { width: max-content; } .panel { top: 132px; } }
      @media (max-width: 640px) {
        .ttl { font-size: 17px; padding: 8px 12px; } .draft { display: none; }
        nav.dest { left: 12px; right: 12px; top: 68px; }
        .leg, .hint { display: none; }
        .panel { left: 12px; right: 12px; top: auto; bottom: 72px; width: auto; max-height: 52svh; overflow: auto; transform: translateY(calc(100% + 120px)); }
        .panel.open { transform: none; } .panel h2 { font-size: 24px; }
        .ctl { right: 12px; bottom: 12px; left: 12px; justify-content: flex-end; }
      }
      @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
    </style>
  </head>
  <body>
    <a class="skip" href="#" id="skip">Visa som lista</a>
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="layer" id="layer"></div>
    <div class="ttl" id="ttl">Karta<small>Lorentzon Visualisation, Göteborg</small></div>
    <nav class="dest" aria-label="Platser"><ul id="chips"></ul></nav>
    <div class="leg" id="leg"><b>Teckenförklaring</b><span>▶ Film &amp; animation</span><span>◆ Interaktiv 3D</span><span>⚙ Verktyg &amp; tillägg</span><span>● Studion · ✉ Kontakt</span></div>
    <p class="hint" id="hint"></p>
    <div class="ctl"><button type="button" id="zin" aria-label="Zooma in">+</button><button type="button" id="zout" aria-label="Zooma ut till kartan">−</button><button type="button" id="lst">Visa som lista</button></div>
    <aside class="panel" id="panel" aria-live="polite" aria-labelledby="p-title">
      <button type="button" class="x" id="p-x" aria-label="Stäng">×</button>
      <small id="p-kick"></small><h2 id="p-title"></h2><p id="p-text"></p><ul id="p-facts"></ul><p class="tip" id="p-tip"></p>
      <div class="acts"><a href="#" id="p-cta"></a><button type="button" id="p-next">Nästa plats →</button></div>
    </aside>
    <div class="list" id="list" hidden role="dialog" aria-modal="true" aria-labelledby="l-title">
      <div class="box"><h2 id="l-title">Alla platser</h2><ul id="l-items"></ul><button type="button" class="close" id="l-close">Stäng</button></div>
    </div>
    <p class="draft">Utkast: prototyp av riktning R. Klicka på en plats, eller kör med WASD.</p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      (function () {
        // MARK: Data. Copy follows today's site; the places are the services, About and Contact.
        const DEST = [
          { id: "film", icon: "▶", name: "Produktfilm", district: "Filmkvarteret", pos: [-50, -35], h: 11,
            kick: "FILMKVARTERET · FILM & ANIMATION", title: "Film innan prototypen finns.",
            text: "Produktfilmer och stillbilder från CAD-filer eller skisser. Stiliserad och teknisk animation för utbildning och medicin.",
            facts: ["Indata: STEP, IGES eller skisser", "Leverans: film, stillbilder och loopar", "Tid: ett par veckor för enklare jobb"], cta: "Se filmerna" },
          { id: "3d", icon: "◆", name: "Interaktiv 3D", district: "3D-hamnen", pos: [25, -20], h: 9,
            kick: "3D-HAMNEN · INTERAKTIV 3D", title: "Låt kunden vrida på den.",
            text: "Konfigurationer, intressepunkter, rörliga delar och AR-läge. I webbläsaren, utan app, inbyggt i din egen sajt.",
            facts: ["Fungerar på mobil och dator", "AR på iPhone och Android"], tip: "Ställ dig på en provbit framför sockeln för att byta material.", cta: "Se den på en sajt" },
          { id: "tools", icon: "⚙", name: "Verktyg", district: "Verkstaden", pos: [10, 45], h: 8,
            kick: "VERKSTADEN · ARBETSFLÖDEN & VERKTYG", title: "Timmar tillbaka varje vecka.",
            text: "Automatisering av långa processer, parametriska 3D-modeller, enklare distribution av assets och återanvändbara komponenter.",
            facts: ["Egna Blender-tillägg", "Pipelines för hela team"], cta: "Se verktygen" },
          { id: "studio", icon: "●", name: "Studion", district: "Om Martin", pos: [-70, 48], h: 8,
            kick: "STUDION · OM MIG", title: "Martin Lorentzon",
            text: "Självlärd 3D-generalist i Göteborg. Yrgo, bilindustrin, undervisning och ett eget företag för verktyg.",
            facts: [], cta: "Läs mer om mig" },
          { id: "contact", icon: "✉", name: "Kontakt", district: "Brevlådan", pos: [75, 32], h: 6,
            kick: "BREVLÅDAN · KONTAKT", title: "Hör av dig.",
            text: "Ett kort samtal, sedan en offert och regelbundna avstämningar. SMS eller e-post går bäst.",
            facts: ["Skicka gärna STEP- eller IGES-filer", "Enklare jobb tar ett par veckor"], cta: "Skriv ett underlag" },
        ];
        DEST.forEach((d) => { d.spawn = [d.pos[0], d.pos[1] + 13]; });
        const START = [0, -6];

        // MARK: World helpers
        const W = { minX: -110, maxX: 110, minZ: -73, maxZ: 77 };
        const zc = (x) => 10 - 0.15 * x; // river centre line
        const COSA = Math.cos(Math.atan(0.15));
        const waterDist = (x, z) => Math.abs(z - zc(x)) * COSA;
        const BRIDGES = [-30, 50];
        const inWater = (x, z) => waterDist(x, z) < 9;
        const onBridge = (x) => BRIDGES.some((b) => Math.abs(x - b) < 2.6);
        let seed = 42;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const lerp = (a, b, t) => a + (b - a) * t;
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
        const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

        // MARK: Renderer and scene
        const canvas = document.getElementById("c");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        const scene = new THREE.Scene();
        const SEA = new THREE.Color(0x9fbcc2), SKY = new THREE.Color(0xe9e4da);
        scene.background = SEA.clone();
        scene.fog = new THREE.Fog(SKY.clone(), 60, 10000);
        const camera = new THREE.PerspectiveCamera(24, 1, 0.5, 4000);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xb9ad98, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.48);
        sun.position.set(-0.5, 1, 0.3);
        scene.add(sun);
        const city = new THREE.Group(); // everything that rises when you zoom in
        scene.add(city);
        const colliders = [];
        const addBox = (x, z, w, d) => colliders.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });
        const unit = new THREE.BoxGeometry(1, 1, 1);
        const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
        function slab(parent, x, z, w, d, h, y, m) { const o = new THREE.Mesh(unit, m); o.scale.set(w, h, d); o.position.set(x, y, z); parent.add(o); return o; }

        // MARK: Ground, river, streets, bridges, parks
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(W.maxX - W.minX, W.maxZ - W.minZ), new THREE.MeshBasicMaterial({ color: 0xddd5c6 }));
        ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, (W.minZ + W.maxZ) / 2); scene.add(ground);
        const water = new THREE.Mesh(new THREE.PlaneGeometry(232 / COSA, 18), new THREE.MeshBasicMaterial({ color: 0x9fbcc2 }));
        water.rotation.order = "YXZ"; water.rotation.set(-Math.PI / 2, Math.atan(0.15), 0); water.position.set(0, 0.05, 10); scene.add(water);
        const streetMat = mat(0xf7f4ee);
        function runs(a, b, ok) { const out = []; let s = null; for (let t = a; t <= b + 0.001; t += 0.5) { const good = ok(t) && t < b; if (good && s === null) s = t; if (!good && s !== null) { out.push([s, t]); s = null; } } return out; }
        for (let x = -90; x <= 90; x += 20) runs(W.minZ, W.maxZ, (z) => !inWater(x, z)).forEach(([a, b]) => slab(scene, x, (a + b) / 2, 4, b - a, 0.1, 0.06, streetMat));
        for (let z = -60; z <= 60; z += 20) runs(W.minX, W.maxX, (x) => !inWater(x, z)).forEach(([a, b]) => slab(scene, (a + b) / 2, z, b - a, 4, 0.1, 0.06, streetMat));
        const bridgeMat = mat(0xefe9de), railMat = mat(0xb9b0a2);
        BRIDGES.forEach((bx) => {
          const len = 2 * (9 / COSA) + 3;
          slab(scene, bx, zc(bx), 7, len, 0.3, 0.15, bridgeMat);
          slab(city, bx - 3.5, zc(bx), 0.2, len, 1, 0.8, railMat); slab(city, bx + 3.5, zc(bx), 0.2, len, 1, 0.8, railMat);
        });
        const PARKS = [[-80, -30, 16, 16], [80, 50, 16, 14]];
        const parkMat = mat(0xb6c2a0), trunkMat = mat(0x8a7a66), crownMat = mat(0x93a47e);
        const trunkGeo = new THREE.CylinderGeometry(0.25, 0.3, 1.4, 6), crownGeo = new THREE.SphereGeometry(1.5, 10, 8);
        PARKS.forEach(([x, z, w, d]) => {
          slab(scene, x, z, w, d, 0.12, 0.06, parkMat);
          for (let i = 0; i < 7; i++) {
            const tx = x - w / 2 + 2 + rnd() * (w - 4), tz = z - d / 2 + 2 + rnd() * (d - 4);
            const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.set(tx, 0.7, tz); city.add(tr);
            const cr = new THREE.Mesh(crownGeo, crownMat); cr.position.set(tx, 2.4, tz); cr.scale.setScalar(0.8 + rnd() * 0.5); city.add(cr);
            addBox(tx, tz, 0.8, 0.8);
          }
        });

        // MARK: City blocks (instanced)
        const PLAZAS = DEST.map((d) => ({ x: d.pos[0], z: d.pos[1] + 5, r: 18 })).concat([{ x: START[0], z: START[1], r: 9 }]);
        const lots = [];
        for (let bx = -100; bx <= 100; bx += 20) for (let bz = -70; bz <= 70; bz += 20) for (const ox of [-3.9, 3.9]) for (const oz of [-3.9, 3.9]) {
          const x = bx + ox, z = bz + oz;
          if (x < W.minX + 4 || x > W.maxX - 4 || z < W.minZ + 4 || z > W.maxZ - 4) continue;
          if (waterDist(x, z) < 14) continue;
          if (PLAZAS.some((p) => Math.hypot(x - p.x, z - p.z) < p.r)) continue;
          if (PARKS.some(([px, pz, w, d]) => Math.abs(x - px) < w / 2 + 4 && Math.abs(z - pz) < d / 2 + 4)) continue;
          if (rnd() < 0.12) continue;
          lots.push({ x, z, w: 5.0 + rnd() * 1.4, d: 5.0 + rnd() * 1.4, h: rnd() < 0.07 ? 12 + rnd() * 6 : 2.5 + rnd() * 6 });
        }
        const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
        const blocks = new THREE.InstancedMesh(bGeo, mat(0xffffff), lots.length);
        const m4 = new THREE.Matrix4(), col = new THREE.Color();
        const PAL = [0xece6db, 0xe5ded0, 0xf1ebe1, 0xdcd3c3, 0xe8e1d4];
        lots.forEach((l, i) => { m4.makeScale(l.w, l.h, l.d); m4.setPosition(l.x, 0, l.z); blocks.setMatrixAt(i, m4); blocks.setColorAt(i, col.setHex(PAL[(rnd() * PAL.length) | 0])); addBox(l.x, l.z, l.w, l.d); });
        city.add(blocks);

        // MARK: Landmarks, one per place
        const anim = [];
        // Film: a cinema with a live screen.
        (function () {
          const [x, z] = DEST[0].pos;
          slab(city, x, z, 16, 10, 11, 5.5, mat(0x2e2c2b));
          slab(city, x, z + 5.3, 16.6, 0.6, 1.2, 10.2, mat(0xf2eee7));
          const fc = document.createElement("canvas"); fc.width = 320; fc.height = 180;
          const fx = fc.getContext("2d"); const tex = new THREE.CanvasTexture(fc);
          const scr = new THREE.Mesh(new THREE.PlaneGeometry(12.8, 7.2), new THREE.MeshBasicMaterial({ map: tex }));
          scr.position.set(x, 5.4, z + 5.05); city.add(scr);
          addBox(x, z, 16, 10);
          anim.push((t) => {
            const g = fx.createLinearGradient(0, 0, 320, 180); g.addColorStop(0, "#1c1b1a"); g.addColorStop(1, "#3a342d");
            fx.fillStyle = g; fx.fillRect(0, 0, 320, 180);
            const px = 160 + Math.sin(t * 0.6) * 18;
            const rg = fx.createRadialGradient(px - 14, 72, 4, px, 96, 62); rg.addColorStop(0, "#fff4e2"); rg.addColorStop(0.5, "#b58a5c"); rg.addColorStop(1, "#2a2017");
            fx.fillStyle = rg; fx.beginPath(); fx.ellipse(px, 98, 30, 48, 0, 0, Math.PI * 2); fx.fill();
            fx.fillStyle = "rgba(255,240,215,0.09)"; fx.fillRect(((t * 70) % 480) - 80, 0, 40, 180);
            fx.fillStyle = "#d8d2c8"; fx.font = "12px monospace";
            const s = Math.floor(t) % 60, f = Math.floor((t % 1) * 25);
            fx.fillText("PRODUKTFILM  00:00:" + String(s).padStart(2, "0") + ":" + String(f).padStart(2, "0"), 12, 20);
            tex.needsUpdate = true;
          });
        })();
        // Interactive 3D: a product on a turning plinth, and material samples to stand on.
        const pads = [];
        let objMat;
        (function () {
          const [x, z] = DEST[1].pos;
          const pl = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.3, 1.2, 40), mat(0xf2eee7)); pl.position.set(x, 0.6, z); city.add(pl);
          const prof = [[0, 0], [1.6, 0], [1.9, 0.3], [2.0, 1.5], [1.8, 4.6], [1.3, 6.2], [0.7, 6.9], [0, 7.1]].map(([a, b]) => new THREE.Vector2(a, b));
          objMat = new THREE.MeshPhongMaterial({ color: 0xac8253, shininess: 50, specular: 0x333333 });
          const obj = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), objMat); obj.position.set(x, 1.2, z); obj.scale.set(1, 1, 0.82); city.add(obj);
          addBox(x, z, 8.6, 8.6);
          [[0xac8253, -6], [0x59655d, 0], [0xb9bdc1, 6]].forEach(([c, dx]) => {
            const p = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.25, 32), mat(c)); p.position.set(x + dx, 0.13, z + 8); scene.add(p);
            pads.push({ x: x + dx, z: z + 8, c: new THREE.Color(c) });
          });
          anim.push((t, dt) => { obj.rotation.y += dt * 0.5; });
        })();
        // Tools: a workshop with a turning gear and a conveyor.
        (function () {

          if (tween) {
            const p = clamp((performance.now() - tween.t0) / tween.ms, 0, 1);
            zoom = lerp(tween.from, tween.to, ease(p));
            if (p >= 1) { const d = tween.done; tween = null; if (d) d(); }
          }
          // MARK: Driving. Keys drive directly; a clicked route drives itself (steer at the next corner, slow for turns, back up if stuck).
          let throttle = 0, steerIn = 0, hand = false;
          if (zoom > 0.98 && !busy()) {
            const kT = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
            const kS = (keys.a || keys.arrowleft ? 1 : 0) - (keys.d || keys.arrowright ? 1 : 0);
            hand = !!keys[" "];
            if (kT || kS || hand) { if (path) clearRoute(); throttle = kT; steerIn = kS; }
            else if (path) {
              let [tx, tz] = path[pathI];
              let dist = Math.hypot(tx - pos.x, tz - pos.y);
              if (pathI < path.length - 1 && dist < 3.4) { pathI++; [tx, tz] = path[pathI]; dist = Math.hypot(tx - pos.x, tz - pos.y); }
              let remain = dist;
              for (let k = pathI; k < path.length - 1; k++) remain += Math.hypot(path[k + 1][0] - path[k][0], path[k + 1][1] - path[k][1]);
              let err = Math.atan2(tx - pos.x, tz - pos.y) - heading; err = Math.atan2(Math.sin(err), Math.cos(err));
              if (pathI === path.length - 1 && dist < 1.8) { clearRoute(); throttle = speed > 0.3 ? -1 : 0; }
              else if (reverseT > 0) {
                reverseT -= dt; throttle = -1; steerIn = revSteer;
                if (reverseT <= 0) { const r = findRoute(pos.x, pos.y, pathGoal[0], pathGoal[1]); if (r && r.length > 1) { path = r; pathI = 1; } else clearRoute(); }
              } else {
                steerIn = clamp(err * 2.4, -1, 1);
                const want = Math.min(18 * clamp(1 - Math.abs(err) / 1.4, 0.22, 1), 2.2 * remain + 2);
                throttle = clamp((want - speed) * 0.35, -1, 1);
                stuckT = Math.abs(speed) < 1.2 ? stuckT + dt : 0;
                if (stuckT > 0.9) { stuckT = 0; reverseT = 0.8; revSteer = -Math.sign(err) || 1; }
              }
            }
          }
          // A simple bicycle model with arcade grip.
          const maxV = keys.shift ? 30 : 20;
          if (throttle && Math.sign(throttle) !== Math.sign(speed) && Math.abs(speed) > 0.5) speed += throttle * 42 * dt;
          else speed += throttle * (throttle > 0 ? 24 : 14) * dt;
          if (!throttle) speed -= speed * Math.min(1, (path ? 1.6 : 2.4) * dt);
          if (hand) speed -= speed * Math.min(1, 2.5 * dt);
          speed = clamp(speed, -9, maxV);
          if (!throttle && Math.abs(speed) < 0.08) speed = 0;
          steer += (steerIn - steer) * Math.min(1, dt * 8);
          const maxSteer = 0.62 * (1 - 0.45 * Math.min(1, Math.abs(speed) / 28)) * (hand ? 1.5 : 1);
          heading += (speed / 2.0) * Math.tan(steer * maxSteer) * dt;
          const fx = Math.sin(heading), fz = Math.cos(heading);
          const dx = fx * speed * dt, dz = fz * speed * dt;
          if (dx || dz) {
            if (!blocked(pos.x + dx, pos.y + dz)) { pos.x += dx; pos.y += dz; }
            else if (!blocked(pos.x + dx, pos.y)) { pos.x += dx; speed *= 0.92; }
            else if (!blocked(pos.x, pos.y + dz)) { pos.y += dz; speed *= 0.92; }
            else speed *= -0.25;
          }
          if (path) showRoute([[pos.x, pos.y]].concat(path.slice(pathI)));
          me.position.set(pos.x, 0, pos.y);
          car.rotation.y = heading;
          wheels.forEach((w) => { w.w.rotation.x += (speed * dt) / 0.36; if (w.front) w.pivot.rotation.y = steer * maxSteer; });
          carBody.rotation.z = lerp(carBody.rotation.z, steer * clamp(speed / 20, -1, 1) * 0.1, Math.min(1, dt * 6));
          carBody.rotation.x = lerp(carBody.rotation.x, -throttle * 0.035 * Math.sign(speed || 1), Math.min(1, dt * 6));
          carBody.position.y = Math.abs(speed) > 1 ? Math.sin(t * 22) * 0.02 : 0;
          // Smoke: more when going fast, accelerating, turning hard or on the handbrake.
          if (zoom > 0.5 && Math.abs(speed) > 0.6) {
            puffAcc += dt * (Math.abs(speed) * 0.9 + Math.max(0, throttle * Math.sign(speed)) * 10 + Math.abs(steer) * Math.abs(speed) * 0.9 + (hand ? 30 : 0));
            const lx = Math.cos(heading), lz = -Math.sin(heading), size = 0.32 + Math.min(0.45, Math.abs(speed) / 45) + (hand ? 0.2 : 0);
            while (puffAcc >= 1) {
              puffAcc -= 1; puffSide = -puffSide;
              puff(pos.x + lx * 0.8 * puffSide - fx * 1.15, pos.y + lz * 0.8 * puffSide - fz * 1.15, size, -fx * 1.6 * Math.sign(speed) + lx * steer * 1.4, -fz * 1.6 * Math.sign(speed) + lz * steer * 1.4);
            }
          }
          updatePuffs(dt);
          follow.lerp(v.set(pos.x, 0, pos.y), 1 - Math.exp(-dt * 9));
          if (zoom > 0.5 && speed > 0.5) { let dy = heading - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); camYaw += dy * Math.min(1, dt * 2.4); }
          // Pads change the product's material.
          pads.forEach((p) => { if (Math.hypot(pos.x - p.x, pos.y - p.z) < 2.1) objMat.color.lerp(p.c, 1 - Math.exp(-dt * 5)); });
          anim.forEach((f) => f(t, dt));

          // Camera: from straight above (map) to behind the visitor (close-up).
          const z = zoom, wxz = 1 - Math.pow(1 - z, 3);
          const h = Math.exp(lerp(Math.log(mapH), Math.log(10.5), z));
          const back = 17 * z * z, cfx = Math.sin(camYaw), cfz = Math.cos(camYaw);
          camera.position.set(lerp(MAPC.x, follow.x, wxz) - cfx * back, h, lerp(MAPC.z, follow.z, wxz) - cfz * back + 0.001);
          look.set(lerp(MAPC.x, follow.x, wxz) + cfx * 4 * z, lerp(0, 1.2, z), lerp(MAPC.z, follow.z, wxz) + cfz * 4 * z);
          camera.up.copy(UP_MAP).lerp(UP_CLOSE, z).normalize();
          camera.lookAt(look);
          camera.fov = lerp(24, 52, z); camera.updateProjectionMatrix();
          city.scale.y = lerp(0.04, 1, smooth(0.25, 0.95, z));
          scene.background.copy(SEA).lerp(SKY, smooth(0.3, 0.9, z));
          scene.fog.color.copy(scene.background); scene.fog.near = lerp(4000, 70, smooth(0.4, 1, z)); scene.fog.far = lerp(9000, 190, smooth(0.4, 1, z));
          const ds = lerp(mapH / 95, 1.35, smooth(0, 0.8, z)); dot.scale.setScalar(ds); halo.scale.setScalar(ds);
          dot.material.opacity = 0.9 * (1 - smooth(0.5, 0.9, z));
          car.visible = z > 0.4; car.scale.setScalar(smooth(0.4, 0.8, z) || 0.001);
          renderer.render(scene, camera);

          // Overlays follow the same camera.
          const mapUi = 1 - smooth(0, 0.35, z);
          DEST.forEach((d) => {
            const lift = lerp(0.5, d.h * city.scale.y + 4, z);
            const p = screen(d.pos[0], lift, d.pos[1]);
            const dist = Math.hypot(pos.x - d.pos[0], pos.y - d.pos[1]);
            const o = z < 0.5 ? 1 : clamp(1.4 - dist / 110, 0, 1);
            place(d.mk, p, lerp(1, 0.85, z), o);
            const lp = { x: p.x, y: p.y - 58, front: p.front }; place(d.dl, lp, 1, mapUi);
          });
          const ra = screen(-40, 0, zc(-40)), rb = screen(40, 0, zc(40)), rp = screen(-6, 0, zc(-6));
          let ang = Math.atan2(rb.y - ra.y, rb.x - ra.x) * 180 / Math.PI; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
          river.style.transform = "translate(" + rp.x + "px," + rp.y + "px) translate(-50%,-50%) rotate(" + ang.toFixed(1) + "deg)"; river.style.opacity = mapUi;
          place(youLbl, (function () { const p = screen(pos.x, 0, pos.y); p.x += 64; return p; })(), 1, mapUi);
          document.getElementById("ttl").style.opacity = 0.35 + 0.65 * mapUi;
          document.getElementById("leg").style.opacity = mapUi;
          document.getElementById("zin").disabled = z > 0.5; document.getElementById("zout").disabled = z < 0.5;
          canvas.style.cursor = z < 0.5 ? "zoom-in" : "pointer";

          // Arriving at a place opens its panel.
          let near = null;
          if (z > 0.98) { let bd = 1e9; DEST.forEach((d) => { const dd = Math.hypot(pos.x - d.spawn[0], pos.y - (d.spawn[1] - 4)); if (dd < bd) { bd = dd; near = d; } }); if (bd > 16) near = null; }
          if (near !== current) {
            current = near; if (near) { fillPanel(near); history.replaceState(null, "", "#" + near.id); }
            DEST.forEach((d) => d.chip.setAttribute("aria-current", d === near ? "true" : "false"));
          }
          panel.classList.toggle("open", !!current && current !== dismissed);
          const hTxt = z < 0.5 ? "Klicka på en plats för att åka dit, eller var som helst på kartan för att köra ner." : "Kör: W/S gas och broms, A/D styr, Space handbroms, Shift turbo · Klicka på marken så kör bilen dit · M visar kartan";
          if (hTxt !== lastHint) { hint.textContent = hTxt; lastHint = hTxt; }
        }
        requestAnimationFrame(frame);

        // Deep links: #film, #3d, #tools, #studio, #contact open straight at that place.
        const start = DEST.find((d) => "#" + d.id === location.hash);
        if (start) { placeAt(start.spawn[0], start.spawn[1], Math.PI); zoom = 1; }
      })();
    </script>
  </body>
</html>
